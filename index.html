<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tablero Vivo</title>
<style>
:root{--bg:#0e1014;--card:#171a21;--card2:#1d2129;--ink:#e7e9ee;--mut:#9aa3b2;--line:#272c36;--red:#ff5d5d;--yellow:#ffce5d;--green:#5ddb8e;--accent:#6ea8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:340px;text-align:center}
.gatebox h1{font-size:20px;margin:0 0 4px}
.gatebox p{color:var(--mut);font-size:13px;margin:0 0 18px}
.gatebox input{width:100%;padding:13px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.gatebox button{width:100%;padding:13px;font-size:15px;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#04122e;cursor:pointer}
.gatebox .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.hdr h1{font-size:24px;margin:0 0 2px;letter-spacing:-.3px}
.hdr .sub{color:var(--mut);margin:0;font-size:14px}
.hdr .meta{color:var(--mut);font-size:12px;margin:6px 0 0}
.note{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:#c7cdd9;margin:16px 0}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.block h2{font-size:16px;margin:0 0 10px}
.block h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px}
.block p{margin:6px 0;font-size:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ph h2{margin:0}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.red{background:rgba(255,93,93,.15);color:var(--red)}
.pill.yellow{background:rgba(255,206,93,.15);color:var(--yellow)}
.prio{border-color:rgba(255,93,93,.4);box-shadow:0 0 0 1px rgba(255,93,93,.12) inset}
.hint{color:var(--mut);font-size:12.5px;margin:2px 0 10px}
.read{color:#c7cdd9}
.kv{list-style:none;padding:0;margin:4px 0;display:flex;flex-wrap:wrap;gap:6px 18px}
.kv li{font-size:13px;color:var(--mut)}
.kv b{color:var(--ink);font-weight:600;margin-right:6px}
.todo,.port{margin:6px 0;padding-left:18px}
.todo li,.port li{font-size:14px;margin:5px 0}
.todo .hot{color:var(--red);font-weight:600;list-style:none;margin-left:-18px;padding:8px 10px;background:rgba(255,93,93,.08);border-radius:8px}
.callout{background:rgba(110,168,255,.08);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13.5px;margin:12px 0;color:#d4dbe8}
.risk{color:var(--yellow);font-size:13px;margin-top:10px}
.cancel{color:var(--red);font-weight:600}
.bars{margin:10px 0}
.bar{display:grid;grid-template-columns:1fr 1.4fr auto;align-items:center;gap:10px;margin:9px 0}
.bar .lbl{font-size:12.5px;color:var(--mut)}
.bar .track{height:9px;background:#23272f;border-radius:999px;overflow:hidden}
.bar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#9c7bff);border-radius:999px}
.bar .val{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.gaps ol{padding-left:18px}
.gaps li{font-size:13.5px;margin:8px 0;color:#c7cdd9}
code{background:#23272f;padding:1px 6px;border-radius:6px;font-size:12px}
.ft{color:var(--mut);font-size:12.5px;margin-top:20px;text-align:center;padding-top:16px;border-top:1px solid var(--line)}
.lock{opacity:0;transition:opacity .25s}
.lock.on{opacity:1}
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <h1>🔒 Tablero Vivo</h1>
    <p>Contenido confidencial. Ingresa la clave.</p>
    <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="clave" autofocus>
    <button id="go">Abrir</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="wrap lock" id="app"></div>

const b2a = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
async function unlock(pass){
  const salt=b2a(DATA.salt), iv=b2a(DATA.iv), ct=b2a(DATA.ct);
  const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function go(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  err.textContent='';
  try{
    const html=await unlock(pw);
    const app=document.getElementById('app');
    app.innerHTML=html;
    document.getElementById('gate').style.display='none';
    app.classList.add('on');
    const r=document.getElementById('rendered');
    if(r) r.textContent='abierto '+new Date().toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit'});
    try{sessionStorage.setItem('tv_k',pw)}catch(e){}
  }catch(e){ err.textContent='Clave incorrecta'; }
}
document.getElementById('go').addEventListener('click',go);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
try{const k=sessionStorage.getItem('tv_k'); if(k){document.getElementById('pw').value=k; go();}}catch(e){}
</script>
